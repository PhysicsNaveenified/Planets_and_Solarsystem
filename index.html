<!DOCTYPE html>
<html>
  <head>
    <title>Solar System Text AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    
    <!-- Fast OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Native camera feed behind WebGL */
      #camFeed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      #hud {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 12px 24px;
        border-radius: 20px;
        font-size: 15px;
        z-index: 1000;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }

      #detected-word {
        font-weight: bold;
        color: #4CAF50;
      }

      #model-status {
        color: #FFC107;
        font-size: 13px;
      }

      #ocrCanvas {
        display: none;
      }
    </style>
  </head>
  <body>

    <!-- Native Camera Background -->
    <video id="camFeed" autoplay playsinline muted></video>

    <div id="hud">
      Status: <span id="ocrStatus">Starting camera...</span><br>
      Detected: <span id="detected-word">None</span><br>
      <span id="model-status"></span>
    </div>

    <canvas id="ocrCanvas"></canvas>

    <!-- Lightweight transparent A-Frame scene -->
    <a-scene embedded vr-mode-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.5" position="1 2 1"></a-light>

      <!-- 3D Model anchored directly in front of the camera view -->
      <a-entity id="modelContainer" position="0 0 -2.5">
        <a-entity
          id="activeModel"
          position="0 0 0"
          rotation="0 0 0"
          visible="false"
          animation-mixer="clip: *; loop: repeat">
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      // File paths mapped directly (loads on demand, saving bandwidth)
      const MODEL_MAP = {
        'SOLAR SYSTEM': './assets/solarsystem.glb',
        'SOLARSYSTEM':  './assets/solarsystem.glb',
        'SUN':          './assets/sun.glb',
        'MOON':         './assets/moon.glb',
        'MERCURY':      './assets/mercury.glb',
        'VENUS':        './assets/venus.glb',
        'EARTH':        './assets/earth.glb',
        'MARS':         './assets/mars.glb',
        'JUPITER':      './assets/jupiter.glb',
        'SATURN':       './assets/saturn.glb',
        'URANUS':       './assets/uranus.glb',
        'NEPTUNE':      './assets/neptune.glb',
        'PLUTO':        './assets/pluto.glb'
      };

      const video = document.getElementById('camFeed');
      const statusEl = document.getElementById('ocrStatus');
      const detectedEl = document.getElementById('detected-word');
      const modelStatusEl = document.getElementById('model-status');
      const activeModel = document.getElementById('activeModel');
      const canvas = document.getElementById('ocrCanvas');
      const ctx = canvas.getContext('2d');

      let currentActiveKey = null;
      let isProcessing = false;
      let ocrWorker = null;

      // 1. Start user camera
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = stream;
          video.play();
          statusEl.textContent = 'Loading OCR Engine...';
          initOCR();
        } catch (err) {
          statusEl.textContent = 'Camera permission denied.';
          console.error(err);
        }
      }

      // 2. Initialize Tesseract
      async function initOCR() {
        try {
          ocrWorker = await Tesseract.createWorker('eng');
          statusEl.textContent = 'Ready — Point camera at text';
          startTextScanLoop();
        } catch (err) {
          statusEl.textContent = 'OCR failed to load.';
          console.error(err);
        }
      }

      // 3. Auto-fit model dimensions dynamically
      function handleModelLoaded() {
        const mesh = activeModel.getObject3D('mesh');
        if (!mesh) return;

        const box = new THREE.Box3().setFromObject(mesh);
        const size = new THREE.Vector3();
        box.getSize(size);

        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const targetSize = 1.2; // Display size in meters
          const factor = targetSize / maxDim;
          activeModel.setAttribute('scale', `${factor} ${factor} ${factor}`);
        }
        activeModel.setAttribute('visible', 'true');
        modelStatusEl.textContent = '';
      }

      activeModel.addEventListener('model-loaded', handleModelLoaded);
      activeModel.addEventListener('model-error', (e) => {
        modelStatusEl.textContent = 'Error loading .glb file. Check file path.';
        console.error('Model load error:', e);
      });

      // 4. Continual text detection loop
      async function startTextScanLoop() {
        setInterval(async () => {
          if (isProcessing || !ocrWorker || video.readyState !== video.HAVE_ENOUGH_DATA) return;

          isProcessing = true;

          // Downsample to 480px width for fast real-time OCR
          const scale = 480 / video.videoWidth;
          canvas.width = 480;
          canvas.height = video.videoHeight * scale;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          try {
            const { data: { text } } = await ocrWorker.recognize(canvas);
            const sanitizedText = text.toUpperCase().replace(/[^A-Z0-9\s]/g, ' ');

            for (const key of Object.keys(MODEL_MAP)) {
              if (sanitizedText.includes(key)) {
                if (currentActiveKey !== key) {
                  currentActiveKey = key;
                  detectedEl.textContent = key;
                  modelStatusEl.textContent = `Loading ${key}...`;
                  
                  // Load the specific .glb dynamically
                  activeModel.setAttribute('gltf-model', MODEL_MAP[key]);
                }
                break;
              }
            }
          } catch (err) {
            console.error('Scan Error:', err);
          } finally {
            isProcessing = false;
          }
        }, 1000);
      }

      window.addEventListener('DOMContentLoaded', startCamera);
    </script>
  </body>
</html>

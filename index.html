<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  canvas { display: block; touch-action: none; }

  /* ---------- Start screen ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px; color: #fff;
    background: radial-gradient(ellipse at 50% 30%, #131a3f 0%, #060714 55%, #000000 100%);
    transition: opacity .5s ease, visibility .5s ease;

  #startScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #startScreen h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; letter-spacing: .3px; }
  #startScreen p.sub { font-size: 14px; line-height: 1.55; opacity: .78; max-width: 360px; margin: 0 0 26px; }
  .btn {
    appearance: none; border: none; cursor: pointer;
    font-size: 15px; font-weight: 600; color: #06101f;
    background: linear-gradient(180deg, #ffe9b3, #ffb238);
    padding: 14px 30px; border-radius: 30px; min-width: 240px;
    box-shadow: 0 6px 18px rgba(255, 178, 56, .35);
  }
  .btn:active { transform: translateY(1px); }
  .btn.secondary {
    background: rgba(255,255,255,.08); color: #fff;
    border: 1px solid rgba(255,255,255,.25); box-shadow: none; margin-top: 12px;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  #arSlot { display: flex; flex-direction: column; align-items: center; }
  #supportNote { margin-top: 18px; font-size: 12.5px; opacity: .55; max-width: 320px; line-height: 1.5; }
  .planetstrip { display:flex; gap:8px; margin-bottom: 26px; }
  .dot { width:10px; height:10px; border-radius:50%; opacity:.85; }

  /* ---------- In-session overlay ---------- */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #instructions {
    position: fixed; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: rgba(8,10,20,.7); color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 13.5px; text-align: center; max-width: 82%; backdrop-filter: blur(8px);
    transition: opacity .35s ease;
  }
  #resetBtn {
    position: fixed; bottom: max(26px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: rgba(8,10,20,.72); color: #fff; border: 1px solid rgba(255,255,255,.25);
    padding: 12px 22px; border-radius: 26px; font-size: 14px; font-weight: 600;
    pointer-events: auto; opacity: 0; transition: opacity .35s ease; backdrop-filter: blur(8px);
  }
  #resetBtn.show { opacity: 1; }
  #exitPreviewBtn {
    position: fixed; top: max(18px, env(safe-area-inset-top)); right: 18px;
    background: rgba(8,10,20,.72); color:#fff; border: 1px solid rgba(255,255,255,.25);
    padding: 8px 14px; border-radius: 20px; font-size: 13px; pointer-events: auto; display: none;

<script type="module">
import * as THREE from "three";
import { ARButton } from "three/addons/webxr/ARButton.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeSeamlessField(seed, octaves, lonBase) {
  const rand = mulberry32(seed);
  const terms = [];
  for (let i = 0; i < octaves; i++) {
    terms.push({
      kx: Math.max(1, Math.round((lonBase + i * lonBase) * (0.6 + rand() * 0.8))),
      ky: 0.6 + rand() * 3.2 + i * 0.9,
      phase: rand() * Math.PI * 2,
      mixY: rand() * Math.PI * 2,
      amp: Math.pow(0.56, i)
    });
  }
  let norm = 0; terms.forEach(t => norm += t.amp);
  return function (theta, ny) {
    let v = 0;
    for (const t of terms) {
      v += t.amp * Math.cos(t.kx * theta + t.phase + Math.sin(t.ky * ny * Math.PI + t.mixY) * 1.4);
    }
    return v / norm;
  };
}

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

function lerpColor(c1, c2, t) {
  return [
    Math.round(c1[0] + (c2[0] - c1[0]) * t),
    Math.round(c1[1] + (c2[1] - c1[1]) * t),
    Math.round(c1[2] + (c2[2] - c1[2]) * t)
  ];
}

function hexToRgb(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rampSample(stops, t) {
  t = clamp01(t);
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (t >= a.p && t <= b.p) {
      const local = (t - a.p) / Math.max(1e-6, (b.p - a.p));
      return lerpColor(a.c, b.c, local);
    }
  }
  return stops[stops.length - 1].c;
}

function buildPlanetTexture(opts) {
  const w = opts.w || 512, h = opts.h || 256;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(w, h);

  const bumpCanvas = document.createElement("canvas");
  bumpCanvas.width = w; bumpCanvas.height = h;
  const bctx = bumpCanvas.getContext("2d");
  const bimg = bctx.createImageData(w, h);

  const base = makeSeamlessField(opts.seed, opts.octaves || 5, opts.lonFreq || 3);
  const detail = makeSeamlessField(opts.seed + 500, 6, (opts.lonFreq || 3) * 3);

  for (let y = 0; y < h; y++) {
    const ny = y / (h - 1);
    for (let x = 0; x < w; x++) {
      const nx = x / w;
      const theta = nx * Math.PI * 2;

      let v = base(theta, ny) * 0.75 + detail(theta * 1.0, ny) * 0.25;
      v = (v + 1) / 2;

      const px = opts.shade(v, nx, ny, theta);
      const idx = (y * w + x) * 4;
      img.data[idx] = px[0]; img.data[idx + 1] = px[1]; img.data[idx + 2] = px[2]; img.data[idx + 3] = 255;

      const bv = Math.round(clamp01(0.5 + (v - 0.5) * (opts.bumpStrength ?? 1)) * 255);
      bimg.data[idx] = bv; bimg.data[idx + 1] = bv; bimg.data[idx + 2] = bv; bimg.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  bctx.putImageData(bimg, 0, 0);

  if (opts.craters) sprinkleCraters(ctx, w, h, opts.seed + 77, opts.craters);
  if (opts.spot) paintSpot(ctx, w, h, opts.spot);
  if (opts.polarCaps) paintPolarCaps(ctx, w, h, opts.polarCaps);

  const colorTex = new THREE.CanvasTexture(canvas);
  colorTex.colorSpace = THREE.SRGBColorSpace;
  colorTex.wrapS = THREE.RepeatWrapping;
  colorTex.anisotropy = 4;

  const bumpTex = new THREE.CanvasTexture(bumpCanvas);
  bumpTex.wrapS = THREE.RepeatWrapping;

  return { colorTex, bumpTex };
}

function sprinkleCraters(ctx, w, h, seed, count) {
  const rand = mulberry32(seed);
  for (let i = 0; i < count; i++) {
    const cx = rand() * w;
    const cy = h * 0.12 + rand() * h * 0.76;
    const r = 3 + rand() * (w * 0.028);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, "rgba(0,0,0,0.55)");
    grad.addColorStop(0.55, "rgba(0,0,0,0.28)");
    grad.addColorStop(0.75, "rgba(255,255,255,0.16)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    if (cx < r) { ctx.beginPath(); ctx.arc(cx + w, cy, r, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill(); }
    if (cx > w - r) { ctx.beginPath(); ctx.arc(cx - w, cy, r, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill(); }
  }
}

function paintSpot(ctx, w, h, spot) {
  const cx = spot.u * w, cy = spot.v * h;
  const rx = spot.rx * w, ry = spot.ry * h;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  grad.addColorStop(0, spot.color);
  grad.addColorStop(0.7, spot.color);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry));
  ctx.translate(-cx, -cy);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(rx, ry), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function paintPolarCaps(ctx, w, h, size) {
  const grad1 = ctx.createLinearGradient(0, 0, 0, h * size);
  grad1.addColorStop(0, "rgba(255,255,255,0.95)");
  grad1.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad1;
  ctx.fillRect(0, 0, w, h * size);

  const grad2 = ctx.createLinearGradient(0, h, 0, h - h * size);
  grad2.addColorStop(0, "rgba(255,255,255,0.95)");
  grad2.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad2;
  ctx.fillRect(0, h - h * size, w, h * size);
}

function buildCloudTexture(seed) {
  const w = 512, h = 256;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(w, h);
  const field = makeSeamlessField(seed, 5, 4);
  const field2 = makeSeamlessField(seed + 21, 6, 9);
  for (let y = 0; y < h; y++) {
    const ny = y / (h - 1);
    for (let x = 0; x < w; x++) {
      const theta = (x / w) * Math.PI * 2;
      let v = field(theta, ny) * 0.6 + field2(theta, ny) * 0.4;
      v = (v + 1) / 2;
      const a = Math.pow(clamp01((v - 0.42) / 0.4), 1.6) * 235;
      const idx = (y * w + x) * 4;
      img.data[idx] = 255; img.data[idx + 1] = 255; img.data[idx + 2] = 255; img.data[idx + 3] = a;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildRingTexture(colorA, colorB, seed) {
  const w = 512, h = 8;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const cA = hexToRgb(colorA), cB = hexToRgb(colorB);
  for (let x = 0; x < w; x++) {
    const t = x / w;
    let band = 0.55 + 0.45 * Math.sin(t * 26 + 1.3) * Math.sin(t * 7.1);
    band *= 0.6 + 0.4 * Math.sin(t * 55 + 4.0);
    const gap1 = Math.exp(-Math.pow((t - 0.42) * 40, 2)) * 0.85;
    const gap2 = Math.exp(-Math.pow((t - 0.71) * 55, 2)) * 0.6;
    let alpha = clamp01(band - gap1 - gap2);
    const edgeFade = Math.min(t / 0.06, (1 - t) / 0.06, 1);
    alpha *= clamp01(edgeFade);
    const rgb = lerpColor(cA, cB, clamp01(0.5 + 0.5 * Math.sin(t * 9 + 2)));
    for (let y = 0; y < h; y++) {
      ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildRingGeometry(innerR, outerR) {
  const geo = new THREE.RingGeometry(innerR, outerR, 128, 1);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  const v3 = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v3.fromBufferAttribute(pos, i);
    const d = v3.length();
    const t = (d - innerR) / (outerR - innerR);
    uv.setXY(i, t, 0.5);
  }
  return geo;
}

function buildLabelSprite(text) {
  const w = 320, h = 96;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.font = "600 46px -apple-system, Roboto, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.85)";
  ctx.shadowBlur = 10;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(text, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.26, 0.078, 1);
  return sprite;
}

let camera, scene, renderer;
let reticle, controller;
let hitTestSource = null, hitTestSourceRequested = false;
let placed = false;
let solarAnchor = null;
let clock = new THREE.Clock();
let rotatingParts = [];

let previewMode = false;
let previewControls = null;

const instructions = document.getElementById("instructions");
const resetBtn = document.getElementById("resetBtn");
const startScreen = document.getElementById("startScreen");
const exitPreviewBtn = document.getElementById("exitPreviewBtn");
const supportNote = document.getElementById("supportNote");
const arSlot = document.getElementById("arSlot");
const previewBtn = document.getElementById("previewBtn");

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 60);
  camera.position.set(0, 1.4, 2.2);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x223047, 1.15);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(1, 2, 1);
  scene.add(dir);

  solarAnchor = new THREE.Group();
  solarAnchor.visible = false;
  buildSolarSystem(solarAnchor);
  scene.add(solarAnchor);

  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffcf6b, transparent: true, opacity: 0.9 })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  setupARButton();

  previewBtn.addEventListener("click", startPreview);
  exitPreviewBtn.addEventListener("click", stopPreview);
  resetBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    placed = false;
    solarAnchor.visible = false;
    reticle.visible = true;
    resetBtn.classList.remove("show");
    instructions.style.opacity = 1;
  });

  window.addEventListener("resize", onWindowResize);
}

function setupARButton() {
  if (!("xr" in navigator)) {
    supportNote.textContent =
      "WebXR isn't available in this browser. Try Chrome on an ARCore-capable Android phone, or use the 3D preview below.";
    return;
  }

  navigator.xr.isSessionSupported("immersive-ar").then((supported) => {
    if (!supported) {
      supportNote.textContent =
        "This browser/device doesn't support WebXR AR. Try Chrome on an ARCore-capable Android phone, or use the 3D preview below.";
      return;
    }
    buildARButton();
  }).catch(() => {
    supportNote.textContent =
      "Couldn't check AR support in this browser. Try Chrome on an ARCore-capable Android phone, or use the 3D preview below.";
  });

  function buildARButton() {
    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["dom-overlay"],
      domOverlay: { root: document.body }
    });
    arButton.textContent = "Start AR";
    arButton.style.cssText = `
      position: static; appearance: none; border: none; cursor: pointer;
      font-size: 15px; font-weight: 600; color: #06101f;
      background: linear-gradient(180deg, #ffe9b3, #ffb238);
      padding: 14px 30px; border-radius: 30px; min-width: 240px;
      box-shadow: 0 6px 18px rgba(255, 178, 56, .35); opacity: 1;
    `;
    arSlot.appendChild(arButton);

    renderer.xr.addEventListener("sessionstart", onSessionStart);
    renderer.xr.addEventListener("sessionend", onSessionEnd);
  }

  controller = renderer.xr.getController(0);
  controller.addEventListener("select", onSelect);
  scene.add(controller);

  // Directly capture screen touch events over the renderer element
  renderer.domElement.addEventListener("pointerup", (e) => {
    if (renderer.xr.isPresenting && !placed && reticle.visible) {
      placeSolarSystem();
    }
  });
}

function onSessionStart() {
  startScreen.classList.add("hidden");
  instructions.style.opacity = 1;
  placed = false;
  solarAnchor.visible = false;
}

function onSessionEnd() {
  startScreen.classList.remove("hidden");
  instructions.style.opacity = 0;
  resetBtn.classList.remove("show");
  hitTestSourceRequested = false;
  hitTestSource = null;
  placed = false;
  solarAnchor.visible = false;
  reticle.visible = false;
}

function onSelect() {
  if (!placed && reticle.visible) {
    placeSolarSystem();
  }
}

function placeSolarSystem() {
  if (!reticle.visible) return;

  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  const scaleV = new THREE.Vector3();

  reticle.matrix.decompose(pos, quat, scaleV);

  const xrCam = (renderer.xr.isPresenting && renderer.xr.getCamera) ? renderer.xr.getCamera() : camera;
  const e = xrCam.matrixWorld.elements;
  const camDir = new THREE.Vector3(-e[8], -e[9], -e[10]).normalize();
  const yaw = Math.atan2(camDir.x, camDir.z);

  // Set directly to detected surface coordinates (pos.y)
  solarAnchor.position.copy(pos);
  solarAnchor.rotation.set(0, yaw, 0);
  solarAnchor.visible = true;

  placed = true;
  reticle.visible = false;
  instructions.style.opacity = 0;
  resetBtn.classList.add("show");
}

function buildSolarSystem(parent) {
  let cumX = -0.25;
  PLANET_DEFS.forEach((def, i) => {
    if (i > 0) {
      const prev = PLANET_DEFS[i - 1];
      cumX += (prev.radius + def.radius) * 2.4 + 0.14;
    }

    const group = new THREE.Group();
    group.position.set(cumX, def.radius + 0.05, Math.cos(i * 2.3) * 0.1);

    const { colorTex, bumpTex } = buildPlanetTexture({
      seed: def.seed,
      octaves: def.octaves,
      lonFreq: def.lonFreq,
      craters: def.craters,
      spot: def.spot,
      polarCaps: def.polarCaps,
      bumpStrength: def.bumpStrength,
      shade: def.shade
    });

    let mat;
    if (def.emissive) {
      mat = new THREE.MeshBasicMaterial({ map: colorTex });
    } else {
      mat = new THREE.MeshStandardMaterial({
        map: colorTex,
        bumpMap: bumpTex,
        bumpScale: 0.006,
        roughness: 0.92,
        metalness: 0.0
      });
    }

    const geo = new THREE.SphereGeometry(def.radius, 48, 32);
    const mesh = new THREE.Mesh(geo, mat);
    group.add(mesh);
    rotatingParts.push({ obj: mesh, speed: def.rotSpeed });

    if (def.emissive) {
      const glowTex = buildGlowTexture();
      const glowMat = new THREE.SpriteMaterial({
        map: glowTex, color: 0xffb84d, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const glow = new THREE.Sprite(glowMat);
      glow.scale.setScalar(def.radius * 6.2);
      group.add(glow);

      const light = new THREE.PointLight(0xffcf8f, 1.3, 6, 2);
      group.add(light);
    }

    if (def.clouds) {
      const cloudTex = buildCloudTexture(def.seed + 3000);
      const cloudMat = new THREE.MeshStandardMaterial({
        map: cloudTex, transparent: true, roughness: 1, depthWrite: false
      });
      const cloudMesh = new THREE.Mesh(
        new THREE.SphereGeometry(def.radius * 1.02, 48, 32), cloudMat
      );
      group.add(cloudMesh);
      rotatingParts.push({ obj: cloudMesh, speed: def.rotSpeed * 0.6 });
    }

    if (def.ring) {
      const r = def.ring;
      const ringTex = buildRingTexture(r.colorA, r.colorB, def.seed + 900);
      const ringGeo = buildRingGeometry(def.radius * r.inner, def.radius * r.outer);
      const ringMat = new THREE.MeshBasicMaterial({
        map: ringTex, transparent: true, opacity: r.opacity,
        side: THREE.DoubleSide, depthWrite: false
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI / 2 - r.tilt;
      group.add(ringMesh);
    }

    const label = buildLabelSprite(def.name);
    label.position.set(0, def.radius + 0.075, 0);
    group.add(label);

    parent.add(group);
  });
}

function buildGlowTexture() {
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, "rgba(255,220,150,0.9)");
  grad.addColorStop(0.4, "rgba(255,170,80,0.45)");
  grad.addColorStop(1, "rgba(255,140,40,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

function startPreview() {
  previewMode = true;
  startScreen.classList.add("hidden");
  exitPreviewBtn.style.display = "block";

  solarAnchor.position.set(0, 0, 0);
  solarAnchor.rotation.set(0, 0, 0);
  solarAnchor.visible = true;

  camera.position.set(0.9, 0.35, 1.6);
  previewControls = new OrbitControls(camera, renderer.domElement);
  previewControls.target.set(0.6, 0, 0);
  previewControls.enableDamping = true;
  previewControls.update();

  renderer.setAnimationLoop(renderLoop);
}

function stopPreview() {
  previewMode = false;
  exitPreviewBtn.style.display = "none";
  startScreen.classList.remove("hidden");
  solarAnchor.visible = false;
  if (previewControls) { previewControls.dispose(); previewControls = null; }
}

function renderLoop(timestamp, frame) {
  if (frame && !previewMode) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace("viewer").then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource && !placed) {
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0) {
        const hit = results[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  const delta = clock.getDelta();
  rotatingParts.forEach(p => { p.obj.rotation.y += delta * p.speed; });
  if (previewMode && previewControls) previewControls.update();

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(renderLoop);

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>

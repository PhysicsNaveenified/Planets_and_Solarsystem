<!DOCTYPE html>
<html>
  <head>
    <title>WebXR AR Solar System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Three.js + WebXR Modules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/ARButton.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }
      #instruction {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 10px 22px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 1000;
        text-align: center;
        pointer-events: none;
      }
      #ar-button-container {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
    </style>
  </head>
  <body>

    <div id="instruction">Point camera at floor and tap screen to place planets</div>
    <div id="ar-button-container"></div>

    <script>
      let camera, scene, renderer;
      let controller, reticle;
      let hitTestSource = null;
      let hitTestSourceRequested = false;
      let solarSystemGroup = null;
      let placed = false;

      // Uniform sizes: Sun is 0.42m, all planets are 0.28m, Moon is 0.12m
      const BODIES = [
        { name: 'Sun',     file: './assets/sun.glb',     size: 0.42, offset: -2.0, speed: 0.005 },
        { name: 'Mercury', file: './assets/mercury.glb', size: 0.28, offset: -1.5, speed: 0.010 },
        { name: 'Venus',   file: './assets/venus.glb',   size: 0.28, offset: -1.0, speed: 0.008 },
        { name: 'Earth',   file: './assets/earth.glb',   size: 0.28, offset: -0.5, speed: 0.015 },
        { name: 'Moon',    file: './assets/moon.glb',    size: 0.12, offset: -0.2, speed: 0.012 },
        { name: 'Mars',    file: './assets/mars.glb',    size: 0.28, offset:  0.2, speed: 0.014 },
        { name: 'Jupiter', file: './assets/jupiter.glb', size: 0.28, offset:  0.7, speed: 0.020 },
        { name: 'Saturn',  file: './assets/saturn.glb',  size: 0.28, offset:  1.2, speed: 0.018 },
        { name: 'Uranus',  file: './assets/uranus.glb',  size: 0.28, offset:  1.7, speed: 0.012 },
        { name: 'Neptune', file: './assets/neptune.glb', size: 0.28, offset:  2.2, speed: 0.011 },
        { name: 'Pluto',   file: './assets/pluto.glb',   size: 0.28, offset:  2.7, speed: 0.006 }
      ];

      const loadedPlanets = [];

      init();
      animate();

      function init() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(2, 4, 2);
        scene.add(dirLight);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // AR Session Launcher
        const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
        document.getElementById('ar-button-container').appendChild(arButton);

        // Reticle ring for surface aiming
        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0x4caf50 })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // Screen tap listener
        controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        window.addEventListener('resize', onWindowResize);
      }

      function onSelect() {
        if (reticle.visible && !placed) {
          placed = true;
          document.getElementById('instruction').textContent = 'Walk around to view the solar system';

          solarSystemGroup = new THREE.Group();
          solarSystemGroup.position.setFromMatrixPosition(reticle.matrix);
          scene.add(solarSystemGroup);

          reticle.visible = false;
          loadPlanets();
        }
      }

      function loadPlanets() {
        const loader = new THREE.GLTFLoader();

        BODIES.forEach((body) => {
          const planetPivot = new THREE.Group();
          planetPivot.position.set(body.offset, 0.25, 0); // Placed at eye level above ground
          solarSystemGroup.add(planetPivot);

          loader.load(
            body.file,
            (gltf) => {
              const model = gltf.scene;

              // Clear embedded animations to eliminate unintended movement
              if (model.animations) model.animations.length = 0;

              // Center geometry to local (0, 0, 0)
              const box = new THREE.Box3().setFromObject(model);
              const center = new THREE.Vector3();
              const size = new THREE.Vector3();
              box.getCenter(center);
              box.getSize(size);

              model.position.sub(center);

              // Normalize every planet to body.size
              const maxDim = Math.max(size.x, size.y, size.z);
              if (maxDim > 0) {
                const scaleFactor = body.size / maxDim;
                model.scale.set(scaleFactor, scaleFactor, scaleFactor);
              }

              planetPivot.add(model);
              loadedPlanets.push({ mesh: model, speed: body.speed });
            },
            undefined,
            (err) => console.warn(`Asset failed: ${body.file}`, err)
          );
        });
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render(timestamp, frame) {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then((viewerSpace) => {
              session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                hitTestSource = source;
              });
            });
            session.addEventListener('end', () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
              placed = false;
            });
            hitTestSourceRequested = true;
          }

          if (hitTestSource && !placed) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
              const hit = hitTestResults[0];
              reticle.visible = true;
              reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
        }

        // Smooth on-axis rotation without position shift
        loadedPlanets.forEach((p) => {
          p.mesh.rotation.y += p.speed;
        });

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System AR - Card-Sized Planet Models</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
      position: absolute;
    }

    #loading-screen {
      position: absolute;
      inset: 0;
      background: rgba(10, 13, 24, 0.95);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #label-card {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 13, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      display: none;
      z-index: 100;
    }
  </style>

  <!-- Import Three.js and MindAR via CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">Loading AR Targets & Anchors...</div>
  </div>

  <div id="label-card">Point camera at a planet card</div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    // Planet list; planetScaleRatio dictates model diameter relative to card width (0.75 = 75% of card width)
    const CELESTIAL_BODIES = [
      { name: "Sun",     mind: "sun.mind",     glb: "sun.glb",     planetScaleRatio: 0.80 },
      { name: "Mercury", mind: "mercury.mind", glb: "mercury.glb", planetScaleRatio: 0.65 },
      { name: "Venus",   mind: "venus.mind",   glb: "venus.glb",   planetScaleRatio: 0.70 },
      { name: "Earth",   mind: "earth.mind",   glb: "earth.glb",   planetScaleRatio: 0.75 },
      { name: "Moon",    mind: "moon.mind",    glb: "moon.glb",    planetScaleRatio: 0.55 },
      { name: "Mars",    mind: "mars.mind",    glb: "mars.glb",    planetScaleRatio: 0.68 },
      { name: "Jupiter", mind: "jupiter.mind", glb: "jupiter.glb", planetScaleRatio: 0.90 },
      { name: "Saturn",  mind: "saturn.mind",  glb: "saturn.glb",  planetScaleRatio: 0.95 },
      { name: "Uranus",  mind: "uranus.mind",  glb: "uranus.glb",  planetScaleRatio: 0.78 },
      { name: "Neptune", mind: "neptune.mind", glb: "neptune.glb", planetScaleRatio: 0.78 }
    ];

    const labelCard = document.getElementById('label-card');
    const loadingScreen = document.getElementById('loading-screen');
    const animatedModels = [];

    // Helper: Soft circular drop-shadow texture
    function createShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0.8)');
      gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.35)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 256, 256);

      return new THREE.CanvasTexture(canvas);
    }

    async function initAR() {
      const mindarThree = new MindARThree({
        container: document.querySelector("#container"),
        imageTargetSrc: CELESTIAL_BODIES.map(item => `./assets/${item.mind}`),
        maxTrack: 1,
        // OneEuroFilter parameters to stabilize fixed positioning on target surface
        filterMinCF: 0.0001,
        filterBeta: 0.001
      });

      const { renderer, scene, camera } = mindarThree;

      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
      dirLight.position.set(2, 5, 3);
      scene.add(dirLight);

      const loader = new GLTFLoader();
      const shadowTexture = createShadowTexture();

      for (let i = 0; i < CELESTIAL_BODIES.length; i++) {
        const item = CELESTIAL_BODIES[i];
        const anchor = mindarThree.addAnchor(i);

        const anchorGroup = new THREE.Group();
        anchor.group.add(anchorGroup);

        // 1. Base Shadow Plane (dimensions updated dynamically on detection)
        const shadowGeo = new THREE.PlaneGeometry(1, 1);
        const shadowMat = new THREE.MeshBasicMaterial({
          map: shadowTexture,
          transparent: true,
          depthWrite: false
        });
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        shadowMesh.position.set(0, 0, 0.001); // Positioned flat against card surface
        anchorGroup.add(shadowMesh);

        // 2. Model Container Group
        const modelContainer = new THREE.Group();
        anchorGroup.add(modelContainer);

        try {
          const gltf = await loader.loadAsync(`./assets/${item.glb}`);
          const rawModel = gltf.scene;

          // Compute raw model bounding box dimensions
          const bbox = new THREE.Box3().setFromObject(rawModel);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          bbox.getSize(size);
          bbox.getCenter(center);

          // Center the planet model relative to origin
          rawModel.position.sub(center);

          // Align rotation (planets oriented perpendicular to card surface)
          rawModel.rotation.x = Math.PI / 2;
          modelContainer.add(rawModel);

          // Maximum native size dimension of the 3D model
          const maxModelDim = Math.max(size.x, size.y, size.z);

          // Track target detection event
          anchor.onTargetFound = () => {
            // Retrieve actual world width/height of scanned image marker
            const targetDimensions = anchor.group.scale;
            const markerWidth = targetDimensions.x || 1.0;

            // Target size calculation based on ratio of card width
            const targetDiameter = markerWidth * item.planetScaleRatio;
            const computedScale = targetDiameter / maxModelDim;

            // Apply computed scale to 3D planet model and shadow
            modelContainer.scale.setScalar(computedScale);
            modelContainer.position.set(0, 0, targetDiameter * 0.5); // Elevate radius height above surface

            shadowMesh.scale.set(targetDiameter * 1.2, targetDiameter * 1.2, 1);

            labelCard.textContent = `🪐 Detected: ${item.name}`;
            labelCard.style.display = 'block';
          };

          animatedModels.push({ mesh: rawModel, speed: 0.006 });

        } catch (err) {
          console.warn(`Error loading model ${item.glb}:`, err);
        }

        anchor.onTargetLost = () => {
          labelCard.style.display = 'none';
        };
      }

      await mindarThree.start();

      loadingScreen.style.opacity = '0';
      setTimeout(() => loadingScreen.remove(), 500);

      renderer.setAnimationLoop(() => {
        animatedModels.forEach(m => {
          if (m.mesh) {
            m.mesh.rotation.y += m.speed; // Y-axis axial rotation
          }
        });
        renderer.render(scene, camera);
      });
    }

    initAR().catch(err => {
      console.error("Initialization failure:", err);
      document.getElementById('loading-text').textContent = "Camera initialization failed or non-HTTPS origin.";
    });
  </script>
</body>
</html>

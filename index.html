<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Solar System AR</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    #container video {
      object-fit: cover !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      background: #0a0d18;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
      text-align: center;
      transition: opacity 0.4s ease;
    }

    .start-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      margin-top: 20px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .start-btn:active {
      transform: scale(0.96);
      background-color: #2563eb;
    }

    #label-card {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 13, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      backdrop-filter: blur(8px);
      display: none;
      z-index: 100;
      white-space: nowrap;
    }

    #status-text {
      font-size: 14px;
      color: #9ca3af;
      margin-top: 12px;
      max-width: 300px;
      line-height: 1.4;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>

  <div id="start-screen">
    <h2 style="margin-bottom: 8px;">Solar System AR</h2>
    <p style="margin: 0; color: #9ca3af;">Explore planets in Augmented Reality</p>
    <button class="start-btn" id="start-btn">Start Camera</button>
    <div id="status-text">Click button to grant camera access</div>
  </div>

  <div id="label-card">Point camera at a planet card</div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    // IMPORTANT: Ensure targets in targets.mind are compiled in this EXACT array order!
    const CELESTIAL_BODIES = [
      { name: "Sun",     glb: "sun.glb",     planetScaleRatio: 0.80 },
      { name: "Mercury", glb: "mercury.glb", planetScaleRatio: 0.65 },
      { name: "Venus",   glb: "venus.glb",   planetScaleRatio: 0.70 },
      { name: "Earth",   glb: "earth.glb",   planetScaleRatio: 0.75 },
      { name: "Moon",    glb: "moon.glb",    planetScaleRatio: 0.55 },
      { name: "Mars",    glb: "mars.glb",    planetScaleRatio: 0.68 },
      { name: "Jupiter", glb: "jupiter.glb", planetScaleRatio: 0.90 },
      { name: "Saturn",  glb: "saturn.glb",  planetScaleRatio: 0.95 },
      { name: "Uranus",  glb: "uranus.glb",  planetScaleRatio: 0.78 },
      { name: "Neptune", glb: "neptune.glb", planetScaleRatio: 0.78 }
    ];

    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const statusText = document.getElementById('status-text');
    const labelCard = document.getElementById('label-card');

    function createShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0.75)');
      gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.3)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);

      return new THREE.CanvasTexture(canvas);
    }

    async function startAR() {
      startBtn.disabled = true;
      startBtn.style.opacity = '0.5';
      statusText.textContent = "Requesting permission & starting camera...";

      try {
        const mindarThree = new MindARThree({
          container: document.querySelector("#container"),
          // FIXED: Single path to compiled master target file
          imageTargetSrc: "./assets/targets.mind",
          maxTrack: 1,
          filterMinCF: 0.001,
          filterBeta: 0.01,
          uiLoading: "no",
          uiScanning: "no"
        });

        const { renderer, scene, camera } = mindarThree;

        // Perf tweak: Cap pixel ratio to 2x for smooth mobile rendering
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        const loader = new GLTFLoader();
        const shadowTexture = createShadowTexture();
        const loadedModelsMap = new Map();

        for (let i = 0; i < CELESTIAL_BODIES.length; i++) {
          const item = CELESTIAL_BODIES[i];
          const anchor = mindarThree.addAnchor(i);

          const anchorGroup = new THREE.Group();
          anchor.group.add(anchorGroup);

          const shadowGeo = new THREE.PlaneGeometry(1, 1);
          const shadowMat = new THREE.MeshBasicMaterial({
            map: shadowTexture,
            transparent: true,
            depthWrite: false
          });
          const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
          shadowMesh.position.set(0, 0, 0.001);
          anchorGroup.add(shadowMesh);

          const modelContainer = new THREE.Group();
          anchorGroup.add(modelContainer);

          anchor.onTargetFound = async () => {
            labelCard.textContent = `🪐 Detected: ${item.name}`;
            labelCard.style.display = 'block';

            if (!loadedModelsMap.has(item.name)) {
              try {
                const gltf = await loader.loadAsync(`./assets/${item.glb}`);
                const rawModel = gltf.scene;

                const bbox = new THREE.Box3().setFromObject(rawModel);
                const size = new THREE.Vector3();
                const center = new THREE.Vector3();
                bbox.getSize(size);
                bbox.getCenter(center);

                rawModel.position.sub(center);
                modelContainer.add(rawModel);

                const maxModelDim = Math.max(size.x, size.y, size.z) || 1.0;
                const targetDimensions = anchor.group.scale;
                const markerWidth = targetDimensions.x || 1.0;
                const targetDiameter = markerWidth * item.planetScaleRatio;
                const computedScale = targetDiameter / maxModelDim;

                modelContainer.scale.setScalar(computedScale);
                modelContainer.position.set(0, 0, targetDiameter * 0.35);
                shadowMesh.scale.set(targetDiameter * 1.1, targetDiameter * 1.1, 1);

                loadedModelsMap.set(item.name, true);
              } catch (err) {
                console.warn(`Could not load GLB file: assets/${item.glb}`, err);
              }
            }
          };

          anchor.onTargetLost = () => {
            labelCard.style.display = 'none';
          };
        }

        await mindarThree.start();

        const videoElem = document.querySelector("#container video");
        if (videoElem) {
          videoElem.setAttribute("playsinline", "");
          videoElem.setAttribute("webkit-playsinline", "");
          videoElem.muted = true;
          await videoElem.play().catch(e => console.warn("Video play warning:", e));
        }

        startScreen.style.opacity = '0';
        setTimeout(() => startScreen.remove(), 400);

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error("Camera startup error:", err);
        startBtn.disabled = false;
        startBtn.style.opacity = '1';
        statusText.style.color = '#ff6b6b';
        statusText.innerHTML = `<strong>Camera Error:</strong> ${err.message}<br><small>Make sure camera permission is granted in settings.</small>`;
      }
    }

    startBtn.addEventListener('click', startAR);
  </script>
</body>
</html>

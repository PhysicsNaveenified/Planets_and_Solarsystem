<!DOCTYPE html>
<html>
  <head>
    <title>Solar System Text AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    
    <!-- Fast OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      #camFeed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        background: transparent !important;
      }

      #hud {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 12px 24px;
        border-radius: 20px;
        font-size: 15px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }

      #detected-word {
        font-weight: bold;
        color: #4CAF50;
      }

      #model-status {
        color: #FFC107;
        font-size: 13px;
        margin-top: 4px;
        display: block;
      }

      #ocrCanvas {
        display: none;
      }
    </style>
  </head>
  <body>

    <!-- Camera Background -->
    <video id="camFeed" autoplay playsinline muted></video>

    <!-- Status HUD -->
    <div id="hud">
      Status: <span id="ocrStatus">Starting camera...</span><br>
      Detected: <span id="detected-word">None</span>
      <span id="model-status"></span>
    </div>

    <canvas id="ocrCanvas"></canvas>

    <!-- Transparent WebGL Scene -->
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true;">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2.0" position="2 4 3"></a-light>

      <!-- Fixed container in AR space -->
      <a-entity id="modelContainer" position="0 0 -2.5">
        <!-- Rotating wrapper that spins strictly around (0, 0, 0) -->
        <a-entity id="spinner">
          <a-entity id="activeModel" visible="false"></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const MODEL_MAP = {
        'SOLAR SYSTEM': './assets/solarsystem.glb',
        'SOLARSYSTEM':  './assets/solarsystem.glb',
        'SUN':          './assets/sun.glb',
        'MOON':         './assets/moon.glb',
        'MERCURY':      './assets/mercury.glb',
        'VENUS':        './assets/venus.glb',
        'EARTH':        './assets/earth.glb',
        'MARS':         './assets/mars.glb',
        'JUPITER':      './assets/jupiter.glb',
        'SATURN':       './assets/saturn.glb',
        'URANUS':       './assets/uranus.glb',
        'NEPTUNE':      './assets/neptune.glb',
        'PLUTO':        './assets/pluto.glb'
      };

      const video = document.getElementById('camFeed');
      const statusEl = document.getElementById('ocrStatus');
      const detectedEl = document.getElementById('detected-word');
      const modelStatusEl = document.getElementById('model-status');
      const activeModel = document.getElementById('activeModel');
      const spinner = document.getElementById('spinner');
      const canvas = document.getElementById('ocrCanvas');
      const ctx = canvas.getContext('2d');

      let currentActiveKey = null;
      let isProcessing = false;
      let ocrWorker = null;

      // 1. Start Device Camera
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = stream;
          await video.play();
          statusEl.textContent = 'Loading OCR Engine...';
          initOCR();
        } catch (err) {
          statusEl.textContent = 'Camera permission denied.';
          console.error(err);
        }
      }

      // 2. Initialize Tesseract
      async function initOCR() {
        try {
          ocrWorker = await Tesseract.createWorker('eng');
          statusEl.textContent = 'Ready — Point camera at text';
          startTextScanLoop();
          startPureSpin();
        } catch (err) {
          statusEl.textContent = 'OCR initialization failed.';
          console.error(err);
        }
      }

      // 3. Perfect center-alignment on load
      activeModel.addEventListener('model-loaded', () => {
        const obj = activeModel.getObject3D('mesh');
        if (!obj) return;

        // Reset any existing local transformations
        obj.position.set(0, 0, 0);
        obj.rotation.set(0, 0, 0);

        // Compute true geometric center
        const box = new THREE.Box3().setFromObject(obj);
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        box.getCenter(center);
        box.getSize(size);

        // Shift inner geometry so center of mass is exactly at local (0, 0, 0)
        obj.position.sub(center);

        // Scale proportionally to fit 1.0 unit box
        const maxDimension = Math.max(size.x, size.y, size.z);
        if (maxDimension > 0) {
          const desiredScale = 1.0 / maxDimension;
          activeModel.setAttribute('scale', `${desiredScale} ${desiredScale} ${desiredScale}`);
        }

        activeModel.setAttribute('visible', 'true');
        modelStatusEl.textContent = '';
      });

      activeModel.addEventListener('model-error', (err) => {
        modelStatusEl.textContent = 'Failed to load model file (404/CORS)';
        console.error('GLTF Load Error:', err);
      });

      // 4. Pure axis rotation without orbital movement
      function startPureSpin() {
        let currentRotation = 0;
        function renderLoop() {
          currentRotation = (currentRotation + 0.4) % 360;
          spinner.setAttribute('rotation', `0 ${currentRotation} 0`);
          requestAnimationFrame(renderLoop);
        }
        renderLoop();
      }

      // 5. OCR Detection Loop
      async function startTextScanLoop() {
        setInterval(async () => {
          if (isProcessing || !ocrWorker || video.readyState !== video.HAVE_ENOUGH_DATA) return;

          isProcessing = true;

          const scale = 480 / video.videoWidth;
          canvas.width = 480;
          canvas.height = video.videoHeight * scale;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          try {
            const { data: { text } } = await ocrWorker.recognize(canvas);
            const cleanText = text.toUpperCase().replace(/[^A-Z0-9\s]/g, ' ');

            for (const key of Object.keys(MODEL_MAP)) {
              if (cleanText.includes(key)) {
                if (currentActiveKey !== key) {
                  currentActiveKey = key;
                  detectedEl.textContent = key;
                  modelStatusEl.textContent = `Loading ${key}...`;
                  
                  activeModel.setAttribute('visible', 'false');
                  activeModel.setAttribute('gltf-model', MODEL_MAP[key]);
                }
                break;
              }
            }
          } catch (err) {
            console.error('OCR Error:', err);
          } finally {
            isProcessing = false;
          }
        }, 1000);
      }

      window.addEventListener('DOMContentLoaded', startCamera);
    </script>
  </body>
</html>

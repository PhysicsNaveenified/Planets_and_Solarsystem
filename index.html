<!DOCTYPE html>
<html>
  <head>
    <title>Universal WebAR Solar System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Three.js + GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      /* Live Hardware Camera Feed */
      #camFeed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      /* WebGL 3D Canvas on top */
      #webgl-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        pointer-events: none;
      }

      #hud {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 22px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }

      #grant-btn {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #4CAF50;
        color: white;
        padding: 14px 24px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>

    <!-- Camera Feed -->
    <video id="camFeed" autoplay playsinline webkit-playsinline muted></video>

    <!-- 3D Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <div id="hud">Starting Camera...</div>
    <button id="grant-btn">Enable Motion / Camera</button>

    <script>
      const hud = document.getElementById('hud');
      const video = document.getElementById('camFeed');
      const grantBtn = document.getElementById('grant-btn');
      const canvas = document.getElementById('webgl-canvas');

      let scene, camera, renderer;
      let solarSystemGroup;
      const loadedPlanets = [];

      // Uniform sizes: Sun = 0.40m, all planets = 0.25m, Moon = 0.10m
      const BODIES = [
        { name: 'Sun',     file: './assets/sun.glb',     size: 0.40, offset: -2.0, speed: 0.003 },
        { name: 'Mercury', file: './assets/mercury.glb', size: 0.25, offset: -1.5, speed: 0.008 },
        { name: 'Venus',   file: './assets/venus.glb',   size: 0.25, offset: -1.0, speed: -0.005 },
        { name: 'Earth',   file: './assets/earth.glb',   size: 0.25, offset: -0.5, speed: 0.010 },
        { name: 'Moon',    file: './assets/moon.glb',    size: 0.10, offset: -0.2, speed: 0.008 },
        { name: 'Mars',    file: './assets/mars.glb',    size: 0.25, offset:  0.2, speed: 0.009 },
        { name: 'Jupiter', file: './assets/jupiter.glb', size: 0.25, offset:  0.7, speed: 0.015 },
        { name: 'Saturn',  file: './assets/saturn.glb',  size: 0.25, offset:  1.2, speed: 0.012 },
        { name: 'Uranus',  file: './assets/uranus.glb',  size: 0.25, offset:  1.7, speed: 0.009 },
        { name: 'Neptune', file: './assets/neptune.glb', size: 0.25, offset:  2.2, speed: 0.008 },
        { name: 'Pluto',   file: './assets/pluto.glb',   size: 0.25, offset:  2.7, speed: 0.004 }
      ];

      // 1. Direct Hardware Camera Startup
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          hud.textContent = '🪐 Loading 3D Solar System...';
          initThree();
          setupOrientationTracking();
        } catch (err) {
          hud.textContent = 'Camera permission required';
          grantBtn.style.display = 'block';
          grantBtn.onclick = () => {
            grantBtn.style.display = 'none';
            startCamera();
          };
        }
      }

      // 2. Initialize Three.js Scene
      function initThree() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 50);
        camera.position.set(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(2, 4, 3);
        scene.add(dirLight);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Place system in front of user
        solarSystemGroup = new THREE.Group();
        solarSystemGroup.position.set(0, -0.1, -1.8);
        scene.add(solarSystemGroup);

        loadAllModels();
        window.addEventListener('resize', onWindowResize);
        animate();
      }

      // 3. Load & Normalize GLB Models to Identical Dimensions
      function loadAllModels() {
        const loader = new THREE.GLTFLoader();

        BODIES.forEach((body) => {
          const planetPivot = new THREE.Group();
          planetPivot.position.set(body.offset, 0, 0);
          solarSystemGroup.add(planetPivot);

          loader.load(
            body.file,
            (gltf) => {
              const model = gltf.scene;

              // Clear animation tracks to prevent position shifting
              if (model.animations) model.animations.length = 0;

              // Compute bounding box
              const box = new THREE.Box3().setFromObject(model);
              const center = new THREE.Vector3();
              const size = new THREE.Vector3();
              box.getCenter(center);
              box.getSize(size);

              // Center geometry to local (0, 0, 0)
              model.position.sub(center);

              // Scale to exact target dimension
              const maxDim = Math.max(size.x, size.y, size.z);
              if (maxDim > 0) {
                const scaleFactor = body.size / maxDim;
                model.scale.set(scaleFactor, scaleFactor, scaleFactor);
              }

              planetPivot.add(model);
              loadedPlanets.push({ mesh: model, speed: body.speed });

              if (loadedPlanets.length === BODIES.length) {
                hud.textContent = '🪐 Look around your room to view';
              }
            },
            undefined,
            (err) => console.warn(`Could not load ${body.file}`, err)
          );
        });
      }

      // 4. Stable Gyroscopic Camera Tracking
      function setupOrientationTracking() {
        function handleOrientation(e) {
          if (e.alpha === null) return;
          const alpha = THREE.MathUtils.degToRad(e.alpha || 0);
          const beta = THREE.MathUtils.degToRad(e.beta || 0);
          const gamma = THREE.MathUtils.degToRad(e.gamma || 0);

          const euler = new THREE.Euler(beta - Math.PI / 2, gamma, -alpha, 'YXZ');
          camera.quaternion.setFromEuler(euler);
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          grantBtn.style.display = 'block';
          grantBtn.textContent = 'Enable Motion Sensor';
          grantBtn.onclick = () => {
            DeviceOrientationEvent.requestPermission().then(res => {
              if (res === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation);
                grantBtn.style.display = 'none';
              }
            });
          };
        } else {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // 5. Render Loop (Only pure on-axis rotation, zero orbital revolution)
      function animate() {
        requestAnimationFrame(animate);

        loadedPlanets.forEach((p) => {
          p.mesh.rotation.y += p.speed;
        });

        renderer.render(scene, camera);
      }

      window.addEventListener('DOMContentLoaded', startCamera);
    </script>
  </body>
</html>

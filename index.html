<!DOCTYPE html>
<html>
  <head>
    <title>3D GLB Solar System Walkthrough</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      /* Camera Feed strictly behind WebGL */
      #camFeed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      /* Transparent A-Frame canvas */
      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        background: transparent !important;
      }

      #ui-panel {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 24px;
        border-radius: 25px;
        font-size: 14px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <!-- Camera Feed Background -->
    <video id="camFeed" autoplay playsinline webkit-playsinline muted></video>

    <!-- Overlay HUD -->
    <div id="ui-panel">
      🪐 Walk around your room to view the solar system
    </div>

    <!-- WebGL AR Scene -->
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true;">
      
      <!-- Device Camera with Gyroscope & Look Controls -->
      <a-camera id="arCamera" position="0 1.2 0" look-controls="enabled: true"></a-camera>

      <!-- Balanced Lighting -->
      <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2.0" position="2 5 2"></a-light>

      <!-- Solar System Lineup in AR (Placed ~1.8m in front of user) -->
      <a-entity id="solarSystemRoot" position="0 0 -1.8">

        <!-- SUN -->
        <a-entity position="-2.6 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="0.2">
            <a-entity gltf-model="./assets/sun.glb" class="planet-model" data-size="0.65"></a-entity>
          </a-entity>
          <a-text value="SUN" align="center" position="0 0.5 0" scale="0.45 0.45 0.45" color="#fff"></a-text>
        </a-entity>

        <!-- MERCURY -->
        <a-entity position="-1.8 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="0.5">
            <a-entity gltf-model="./assets/mercury.glb" class="planet-model" data-size="0.14"></a-entity>
          </a-entity>
          <a-text value="Mercury" align="center" position="0 0.22 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- VENUS -->
        <a-entity position="-1.35 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="-0.3">
            <a-entity gltf-model="./assets/venus.glb" class="planet-model" data-size="0.22"></a-entity>
          </a-entity>
          <a-text value="Venus" align="center" position="0 0.26 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- EARTH & MOON PAIR -->
        <a-entity position="-0.85 0 0" class="planet-container">
          <!-- Earth -->
          <a-entity class="spinner" data-speed="0.8">
            <a-entity gltf-model="./assets/earth.glb" class="planet-model" data-size="0.24"></a-entity>
          </a-entity>
          <!-- Moon slightly offset to the side -->
          <a-entity position="0.22 0.08 0">
            <a-entity class="spinner" data-speed="0.4">
              <a-entity gltf-model="./assets/moon.glb" class="planet-model" data-size="0.08"></a-entity>
            </a-entity>
            <a-text value="Moon" align="center" position="0 0.12 0" scale="0.25 0.25 0.25" color="#aaa"></a-text>
          </a-entity>
          <a-text value="Earth" align="center" position="0 0.28 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- MARS -->
        <a-entity position="-0.35 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="0.7">
            <a-entity gltf-model="./assets/mars.glb" class="planet-model" data-size="0.18"></a-entity>
          </a-entity>
          <a-text value="Mars" align="center" position="0 0.24 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- JUPITER -->
        <a-entity position="0.25 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="1.4">
            <a-entity gltf-model="./assets/jupiter.glb" class="planet-model" data-size="0.45"></a-entity>
          </a-entity>
          <a-text value="Jupiter" align="center" position="0 0.38 0" scale="0.4 0.4 0.4" color="#ddd"></a-text>
        </a-entity>

        <!-- SATURN -->
        <a-entity position="0.95 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="1.2">
            <a-entity gltf-model="./assets/saturn.glb" class="planet-model" data-size="0.42"></a-entity>
          </a-entity>
          <a-text value="Saturn" align="center" position="0 0.36 0" scale="0.4 0.4 0.4" color="#ddd"></a-text>
        </a-entity>

        <!-- URANUS -->
        <a-entity position="1.65 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="1.0">
            <a-entity gltf-model="./assets/uranus.glb" class="planet-model" data-size="0.30"></a-entity>
          </a-entity>
          <a-text value="Uranus" align="center" position="0 0.30 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- NEPTUNE -->
        <a-entity position="2.25 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="0.9">
            <a-entity gltf-model="./assets/neptune.glb" class="planet-model" data-size="0.28"></a-entity>
          </a-entity>
          <a-text value="Neptune" align="center" position="0 0.28 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- PLUTO -->
        <a-entity position="2.75 0 0" class="planet-container">
          <a-entity class="spinner" data-speed="0.3">
            <a-entity gltf-model="./assets/pluto.glb" class="planet-model" data-size="0.10"></a-entity>
          </a-entity>
          <a-text value="Pluto" align="center" position="0 0.18 0" scale="0.3 0.3 0.3" color="#bbb"></a-text>
        </a-entity>

      </a-entity>

    </a-scene>

    <script>
      const video = document.getElementById('camFeed');

      // 1. Fast, Direct Camera Setup
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
        } catch (err) {
          console.error('Camera access error:', err);
        }
      }

      // 2. Auto-Center and Auto-Scale Each .GLB Model to Its Relative Target Size
      function initModelLoaders() {
        const modelEls = document.querySelectorAll('.planet-model');

        modelEls.forEach((el) => {
          el.addEventListener('model-loaded', () => {
            const threeGroup = el.getObject3D('mesh');
            if (!threeGroup) return;

            // Clear internal keyframe tracks so they don't break positioning
            if (threeGroup.animations) {
              threeGroup.animations.length = 0;
            }

            threeGroup.position.set(0, 0, 0);
            threeGroup.scale.set(1, 1, 1);
            threeGroup.updateMatrixWorld(true);

            // Compute exact geometric bounding box
            const bbox = new THREE.Box3().setFromObject(threeGroup);
            const center = new THREE.Vector3();
            const size = new THREE.Vector3();
            bbox.getCenter(center);
            bbox.getSize(size);

            // Shift inner vertices to dead-center (0, 0, 0)
            threeGroup.traverse((child) => {
              if (child.isMesh) {
                child.geometry.computeBoundingBox();
                child.position.sub(center);
              }
            });

            // Scale to target dimension defined in data-size attribute
            const targetSize = parseFloat(el.getAttribute('data-size')) || 0.3;
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scaleFactor = targetSize / maxDim;
              el.setAttribute('scale', `${scaleFactor} ${scaleFactor} ${scaleFactor}`);
            }
          });
        });
      }

      // 3. Smooth On-Axis Spin for Each Planet
      function startRotationLoop() {
        const spinners = document.querySelectorAll('.spinner');
        let angle = 0;

        function animate() {
          angle += 0.4;
          spinners.forEach((sp) => {
            const speed = parseFloat(sp.getAttribute('data-speed')) || 1.0;
            const currentY = (angle * speed) % 360;
            sp.setAttribute('rotation', `0 ${currentY} 0`);
          });
          requestAnimationFrame(animate);
        }
        animate();
      }

      window.addEventListener('DOMContentLoaded', () => {
        startCamera();
        initModelLoaders();
        startRotationLoop();
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>3D AR Solar System Walkthrough</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      #camFeed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        background: transparent !important;
      }

      #ui-panel {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 24px;
        border-radius: 25px;
        font-size: 14px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <!-- Camera Feed Background -->
    <video id="camFeed" autoplay playsinline webkit-playsinline muted></video>

    <!-- Overlay Controls -->
    <div id="ui-panel">
      🪐 Walk around your room to view the solar system
    </div>

    <!-- WebGL AR Scene -->
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true;">
      
      <!-- User / Device Camera -->
      <a-camera id="arCamera" position="0 1.2 0" look-controls="enabled: true"></a-camera>

      <!-- Global Lighting -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.8" position="2 5 2"></a-light>

      <!-- Root Container for the Entire Planetary System (Placed on floor in front of you) -->
      <a-entity id="solarSystemRoot" position="0 0 -1.5">

        <!-- SUN (Emissive Glow) -->
        <a-entity id="body-sun" position="-2.2 0 0">
          <a-sphere radius="0.32" material="color: #ff9900; emissive: #ff5500; emissiveIntensity: 0.8; roughness: 0.2;"></a-sphere>
          <a-text value="SUN" align="center" position="0 0.45 0" scale="0.5 0.5 0.5" color="#fff"></a-text>
        </a-entity>

        <!-- MERCURY -->
        <a-entity id="body-mercury" position="-1.5 0 0">
          <a-sphere radius="0.07" material="color: #8c8c8c; roughness: 0.9; metalness: 0.1;"></a-sphere>
          <a-text value="Mercury" align="center" position="0 0.22 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- VENUS -->
        <a-entity id="body-venus" position="-1.1 0 0">
          <a-sphere radius="0.11" material="color: #e3bb76; roughness: 0.7;"></a-sphere>
          <a-text value="Venus" align="center" position="0 0.25 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- EARTH -->
        <a-entity id="body-earth" position="-0.65 0 0">
          <a-sphere radius="0.12" material="color: #2b82c9; roughness: 0.4; metalness: 0.1;"></a-sphere>
          <a-text value="Earth" align="center" position="0 0.26 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- MARS -->
        <a-entity id="body-mars" position="-0.25 0 0">
          <a-sphere radius="0.09" material="color: #c1440e; roughness: 0.8;"></a-sphere>
          <a-text value="Mars" align="center" position="0 0.24 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- JUPITER -->
        <a-entity id="body-jupiter" position="0.3 0 0">
          <a-sphere radius="0.25" material="color: #d8ca9d; roughness: 0.6;"></a-sphere>
          <a-text value="Jupiter" align="center" position="0 0.38 0" scale="0.4 0.4 0.4" color="#ddd"></a-text>
        </a-entity>

        <!-- SATURN (With 3D Planetary Ring) -->
        <a-entity id="body-saturn" position="1.0 0 0">
          <a-sphere radius="0.20" material="color: #ead6b8; roughness: 0.5;"></a-sphere>
          <a-ring radius-inner="0.26" radius-outer="0.42" rotation="75 20 0" material="color: #c9b48c; side: double; roughness: 0.4;"></a-ring>
          <a-text value="Saturn" align="center" position="0 0.35 0" scale="0.4 0.4 0.4" color="#ddd"></a-text>
        </a-entity>

        <!-- URANUS (With Faint Ring) -->
        <a-entity id="body-uranus" position="1.65 0 0">
          <a-sphere radius="0.15" material="color: #4b70dd; roughness: 0.5;"></a-sphere>
          <a-ring radius-inner="0.19" radius-outer="0.28" rotation="85 -30 0" material="color: #88aaff; side: double; opacity: 0.7; transparent: true;"></a-ring>
          <a-text value="Uranus" align="center" position="0 0.3 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

        <!-- NEPTUNE -->
        <a-entity id="body-neptune" position="2.2 0 0">
          <a-sphere radius="0.14" material="color: #274687; roughness: 0.5;"></a-sphere>
          <a-text value="Neptune" align="center" position="0 0.28 0" scale="0.35 0.35 0.35" color="#ddd"></a-text>
        </a-entity>

      </a-entity>

    </a-scene>

    <script>
      const video = document.getElementById('camFeed');

      // 1. Instant Camera Setup
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
        } catch (err) {
          console.error('Camera error:', err);
        }
      }

      // 2. Individual On-Axis Rotation for Each Planet
      function animatePlanets() {
        const planets = [
          { id: 'body-sun', speed: 0.2 },
          { id: 'body-mercury', speed: 0.6 },
          { id: 'body-venus', speed: -0.4 },
          { id: 'body-earth', speed: 1.0 },
          { id: 'body-mars', speed: 0.9 },
          { id: 'body-jupiter', speed: 1.8 },
          { id: 'body-saturn', speed: 1.5 },
          { id: 'body-uranus', speed: 1.2 },
          { id: 'body-neptune', speed: 1.1 }
        ];

        let rot = 0;
        function loop() {
          rot += 0.5;
          planets.forEach(p => {
            const el = document.getElementById(p.id);
            if (el) {
              const currentAngle = (rot * p.speed) % 360;
              el.querySelector('a-sphere').setAttribute('rotation', `0 ${currentAngle} 0`);
            }
          });
          requestAnimationFrame(loop);
        }
        loop();
      }

      window.addEventListener('DOMContentLoaded', () => {
        startCamera();
        animatePlanets();
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>Text-Anchored AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    
    <!-- Fast OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      #camFeed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        background: transparent !important;
      }

      #hud {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 22px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }

      #detected-word {
        font-weight: bold;
        color: #4CAF50;
      }

      #ocrCanvas {
        display: none;
      }
    </style>
  </head>
  <body>

    <!-- Camera Feed -->
    <video id="camFeed" autoplay playsinline muted></video>

    <!-- Status HUD -->
    <div id="hud">
      Status: <span id="ocrStatus">Starting camera...</span><br>
      Detected: <span id="detected-word">None</span>
    </div>

    <canvas id="ocrCanvas"></canvas>

    <!-- Transparent WebGL AR Scene -->
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true;">
      
      <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false" fov="80"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.8" position="2 4 3"></a-light>

      <!-- Anchored in front of camera plane; dynamic position follows text center -->
      <a-entity id="textTracker" position="0 0 -2" visible="false">
        <!-- Spinner rotating strictly around the perpendicular Z-axis -->
        <a-entity id="spinner">
          <a-entity id="activeModel"></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const MODEL_MAP = {
        'SOLAR SYSTEM': './assets/solarsystem.glb',
        'SOLARSYSTEM':  './assets/solarsystem.glb',
        'SUN':          './assets/sun.glb',
        'MOON':         './assets/moon.glb',
        'MERCURY':      './assets/mercury.glb',
        'VENUS':        './assets/venus.glb',
        'EARTH':        './assets/earth.glb',
        'MARS':         './assets/mars.glb',
        'JUPITER':      './assets/jupiter.glb',
        'SATURN':       './assets/saturn.glb',
        'URANUS':       './assets/uranus.glb',
        'NEPTUNE':      './assets/neptune.glb',
        'PLUTO':        './assets/pluto.glb'
      };

      const video = document.getElementById('camFeed');
      const statusEl = document.getElementById('ocrStatus');
      const detectedEl = document.getElementById('detected-word');
      const textTracker = document.getElementById('textTracker');
      const spinner = document.getElementById('spinner');
      const activeModel = document.getElementById('activeModel');
      const canvas = document.getElementById('ocrCanvas');
      const ctx = canvas.getContext('2d');

      let currentActiveKey = null;
      let isProcessing = false;
      let ocrWorker = null;
      let lastSeenTime = 0;
      const HIDE_TIMEOUT_MS = 1400; // Hides model 1.4s after text is lost/removed

      // 1. Start Camera
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = stream;
          await video.play();
          statusEl.textContent = 'Loading OCR Engine...';
          initOCR();
        } catch (err) {
          statusEl.textContent = 'Camera permission denied.';
          console.error(err);
        }
      }

      // 2. Initialize Tesseract
      async function initOCR() {
        try {
          ocrWorker = await Tesseract.createWorker('eng');
          statusEl.textContent = 'Ready — Point camera at text';
          startTextScanLoop();
          startPerpendicularSpin();
        } catch (err) {
          statusEl.textContent = 'OCR initialization failed.';
          console.error(err);
        }
      }

      // 3. Center and normalize the model geometry
      activeModel.addEventListener('model-loaded', () => {
        const obj = activeModel.getObject3D('mesh');
        if (!obj) return;

        obj.position.set(0, 0, 0);
        obj.rotation.set(0, 0, 0);

        const box = new THREE.Box3().setFromObject(obj);
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        box.getCenter(center);
        box.getSize(size);

        // Shift inner geometry so geometric center is exact (0, 0, 0)
        obj.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const desiredScale = 0.9 / maxDim;
          activeModel.setAttribute('scale', `${desiredScale} ${desiredScale} ${desiredScale}`);
        }
      });

      // 4. Spin strictly around the axis perpendicular to the text plane (Z-axis)
      function startPerpendicularSpin() {
        let currentRot = 0;
        function renderLoop() {
          currentRot = (currentRot + 0.6) % 360;
          // Perpendicular to view/camera plane is the Z-axis rotation
          spinner.setAttribute('rotation', `0 0 ${currentRot}`);

          // Visibility check: auto-hide if text is no longer in view
          if (Date.now() - lastSeenTime > HIDE_TIMEOUT_MS && textTracker.getAttribute('visible')) {
            textTracker.setAttribute('visible', 'false');
            detectedEl.textContent = 'None';
            currentActiveKey = null;
          }

          requestAnimationFrame(renderLoop);
        }
        renderLoop();
      }

      // 5. OCR & Real-time Bounding Box Text Tracking
      async function startTextScanLoop() {
        setInterval(async () => {
          if (isProcessing || !ocrWorker || video.readyState !== video.HAVE_ENOUGH_DATA) return;

          isProcessing = true;

          const scanW = 480;
          const scanH = Math.round(video.videoHeight * (scanW / video.videoWidth));
          canvas.width = scanW;
          canvas.height = scanH;
          ctx.drawImage(video, 0, 0, scanW, scanH);

          try {
            const { data } = await ocrWorker.recognize(canvas);
            let matchFound = false;

            if (data && data.words) {
              for (const wordObj of data.words) {
                const cleanedText = wordObj.text.toUpperCase().replace(/[^A-Z0-9]/g, '');

                for (const key of Object.keys(MODEL_MAP)) {
                  const keyCleaned = key.replace(/\s+/g, '');
                  if (cleanedText === keyCleaned || cleanedText.includes(keyCleaned)) {
                    matchFound = true;
                    lastSeenTime = Date.now();

                    // Calculate center of the detected text bounding box
                    const bbox = wordObj.bbox;
                    const textCenterX = (bbox.x0 + bbox.x1) / 2;
                    const textCenterY = (bbox.y0 + bbox.y1) / 2;

                    // Convert pixel coordinates (0 to scanW/scanH) to normalized device coordinates (-1 to 1)
                    const ndcX = (textCenterX / scanW) * 2 - 1;
                    const ndcY = -((textCenterY / scanH) * 2 - 1);

                    // Project text position onto the 3D plane at z = -2.0 meters
                    const planeZ = -2.0;
                    const fovRad = (80 * Math.PI) / 180;
                    const planeHalfH = Math.tan(fovRad / 2) * Math.abs(planeZ);
                    const planeHalfW = planeHalfH * (window.innerWidth / window.innerHeight);

                    const posX = ndcX * planeHalfW;
                    const posY = ndcY * planeHalfH;

                    textTracker.setAttribute('position', `${posX.toFixed(3)} ${posY.toFixed(3)} ${planeZ}`);

                    // Swap model if new word
                    if (currentActiveKey !== key) {
                      currentActiveKey = key;
                      detectedEl.textContent = key;
                      activeModel.setAttribute('gltf-model', MODEL_MAP[key]);
                    }

                    textTracker.setAttribute('visible', 'true');
                    break;
                  }
                }
                if (matchFound) break;
              }
            }
          } catch (err) {
            console.error('OCR Error:', err);
          } finally {
            isProcessing = false;
          }
        }, 800);
      }

      window.addEventListener('DOMContentLoaded', startCamera);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>Text-Anchored AR (Optimized)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Lightweight OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      #camFeed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        background: transparent !important;
      }

      #hud {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 22px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }

      #detected-word {
        font-weight: bold;
        color: #4CAF50;
      }

      #ocrCanvas {
        display: none;
      }
    </style>
  </head>
  <body>

    <video id="camFeed" autoplay playsinline webkit-playsinline muted></video>

    <div id="hud">
      Status: <span id="ocrStatus">Starting camera...</span><br>
      Detected: <span id="detected-word">None</span>
    </div>

    <canvas id="ocrCanvas"></canvas>

    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: false; powerPreference: high-performance; precision: mediump;">
      
      <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false" fov="80"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2.0" position="2 4 3"></a-light>

      <!-- Anchored stationary in 3D space -->
      <a-entity id="textTracker" position="0 0 -2" visible="false">
        <a-entity id="activeModel"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const MODEL_MAP = {
        'SOLARSYSTEM':  './assets/solarsystem.glb',
        'SUN':          './assets/sun.glb',
        'MOON':         './assets/moon.glb',
        'MERCURY':      './assets/mercury.glb',
        'VENUS':        './assets/venus.glb',
        'EARTH':        './assets/earth.glb',
        'MARS':         './assets/mars.glb',
        'JUPITER':      './assets/jupiter.glb',
        'SATURN':       './assets/saturn.glb',
        'URANUS':       './assets/uranus.glb',
        'NEPTUNE':      './assets/neptune.glb',
        'PLUTO':        './assets/pluto.glb'
      };

      // Exact whitelist characters for faster OCR processing
      const WHITELIST = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ';

      const video = document.getElementById('camFeed');
      const statusEl = document.getElementById('ocrStatus');
      const detectedEl = document.getElementById('detected-word');
      const textTracker = document.getElementById('textTracker');
      const activeModel = document.getElementById('activeModel');
      const canvas = document.getElementById('ocrCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      let currentActiveKey = null;
      let isProcessing = false;
      let ocrWorker = null;
      let lastSeenTime = 0;
      let target3DSize = 0.5;
      const HIDE_TIMEOUT_MS = 1800;

      // 1. Efficient camera start
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
              facingMode: { ideal: 'environment' }, 
              width: { ideal: 960 }, 
              height: { ideal: 540 } 
            },
            audio: false
          });
          video.srcObject = stream;
          video.onloadedmetadata = async () => {
            await video.play();
            statusEl.textContent = 'Initializing engine...';
            initOCR();
          };
        } catch (err) {
          statusEl.textContent = 'Camera permission required.';
          console.error(err);
        }
      }

      // 2. High-speed OCR config with character whitelist & fast mode
      async function initOCR() {
        try {
          ocrWorker = await Tesseract.createWorker('eng', 1, {
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
            corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core-simd.wasm.js'
          });

          await ocrWorker.setParameters({
            tessedit_char_whitelist: WHITELIST,
            tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT
          });

          statusEl.textContent = 'Ready — Point camera at text';
          startFastDetectionLoop();
          startVisibilityWatchdog();
        } catch (err) {
          statusEl.textContent = 'OCR initialization failed.';
          console.error(err);
        }
      }

      // 3. One-time model normalization on load
      activeModel.addEventListener('model-loaded', () => {
        const threeGroup = activeModel.getObject3D('mesh');
        if (!threeGroup) return;

        // Clear embedded animation tracks
        if (threeGroup.animations) threeGroup.animations.length = 0;

        threeGroup.position.set(0, 0, 0);
        threeGroup.rotation.set(0, 0, 0);
        threeGroup.scale.set(1, 1, 1);

        const bbox = new THREE.Box3().setFromObject(threeGroup);
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        bbox.getCenter(center);
        bbox.getSize(size);

        threeGroup.traverse((child) => {
          if (child.isMesh) {
            child.geometry.computeBoundingBox();
            child.position.sub(center);
          }
        });

        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const s = target3DSize / maxDim;
          activeModel.setAttribute('scale', `${s} ${s} ${s}`);
        }
      });

      // 4. Auto-hide loop
      function startVisibilityWatchdog() {
        function check() {
          if (Date.now() - lastSeenTime > HIDE_TIMEOUT_MS && textTracker.getAttribute('visible')) {
            textTracker.setAttribute('visible', 'false');
            detectedEl.textContent = 'None';
            currentActiveKey = null;
          }
          requestAnimationFrame(check);
        }
        check();
      }

      // 5. Fast downsampled frame scanning
      async function startFastDetectionLoop() {
        setInterval(async () => {
          if (isProcessing || !ocrWorker || video.readyState < 2) return;

          isProcessing = true;

          // Downsample to 320px width for fast recognition without dropping accuracy
          const scanW = 320;
          const scanH = Math.round(video.videoHeight * (scanW / video.videoWidth)) || 240;
          canvas.width = scanW;
          canvas.height = scanH;
          ctx.drawImage(video, 0, 0, scanW, scanH);

          try {
            const { data } = await ocrWorker.recognize(canvas);
            let matchFound = false;

            if (data && data.words) {
              for (const wordObj of data.words) {
                const cleanedText = wordObj.text.toUpperCase().replace(/[^A-Z0-9]/g, '');

                for (const key of Object.keys(MODEL_MAP)) {
                  if (cleanedText === key || cleanedText.includes(key)) {
                    matchFound = true;
                    lastSeenTime = Date.now();

                    const bbox = wordObj.bbox;
                    const textCenterX = (bbox.x0 + bbox.x1) / 2;
                    const textCenterY = (bbox.y0 + bbox.y1) / 2;
                    const textPixelWidth = Math.abs(bbox.x1 - bbox.x0);

                    // Perspective transformation to Z = -2.0 plane
                    const ndcX = (textCenterX / scanW) * 2 - 1;
                    const ndcY = -((textCenterY / scanH) * 2 - 1);

                    const planeZ = -2.0;
                    const fovRad = (80 * Math.PI) / 180;
                    const planeHalfH = Math.tan(fovRad / 2) * Math.abs(planeZ);
                    const planeHalfW = planeHalfH * (window.innerWidth / window.innerHeight);

                    const posX = ndcX * planeHalfW;
                    const posY = ndcY * planeHalfH;

                    const text3DWidth = (textPixelWidth / scanW) * (planeHalfW * 2);
                    target3DSize = Math.max(text3DWidth, 0.25);

                    textTracker.setAttribute('position', `${posX.toFixed(3)} ${posY.toFixed(3)} ${planeZ}`);

                    const threeGroup = activeModel.getObject3D('mesh');
                    if (threeGroup) {
                      const box = new THREE.Box3().setFromObject(threeGroup);
                      const size = new THREE.Vector3();
                      box.getSize(size);
                      const maxDim = Math.max(size.x, size.y, size.z);
                      if (maxDim > 0) {
                        const s = target3DSize / maxDim;
                        activeModel.setAttribute('scale', `${s} ${s} ${s}`);
                      }
                    }

                    if (currentActiveKey !== key) {
                      currentActiveKey = key;
                      detectedEl.textContent = key;
                      activeModel.setAttribute('gltf-model', MODEL_MAP[key]);
                    }

                    textTracker.setAttribute('visible', 'true');
                    break;
                  }
                }
                if (matchFound) break;
              }
            }
          } catch (err) {
            console.error('Scan Error:', err);
          } finally {
            isProcessing = false;
          }
        }, 500);
      }

      window.addEventListener('DOMContentLoaded', startCamera);
    </script>
  </body>
</html>

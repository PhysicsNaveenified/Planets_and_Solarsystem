<!DOCTYPE html>
<html>
  <head>
    <title>Text-Anchored AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      #camFeed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        background: transparent !important;
      }

      #hud {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 22px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }

      #detected-word {
        font-weight: bold;
        color: #4CAF50;
      }

      #ocrCanvas {
        display: none;
      }
    </style>
  </head>
  <body>

    <video id="camFeed" autoplay playsinline muted></video>

    <div id="hud">
      Status: <span id="ocrStatus">Starting camera...</span><br>
      Detected: <span id="detected-word">None</span>
    </div>

    <canvas id="ocrCanvas"></canvas>

    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true;">
      
      <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false" fov="80"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2.0" position="2 4 3"></a-light>

      <!-- Positioned directly at the 3D center of the detected text -->
      <a-entity id="textTracker" position="0 0 -2" visible="false">
        <a-entity id="activeModel"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const MODEL_MAP = {
        'SOLAR SYSTEM': './assets/solarsystem.glb',
        'SOLARSYSTEM':  './assets/solarsystem.glb',
        'SUN':          './assets/sun.glb',
        'MOON':         './assets/moon.glb',
        'MERCURY':      './assets/mercury.glb',
        'VENUS':        './assets/venus.glb',
        'EARTH':        './assets/earth.glb',
        'MARS':         './assets/mars.glb',
        'JUPITER':      './assets/jupiter.glb',
        'SATURN':       './assets/saturn.glb',
        'URANUS':       './assets/uranus.glb',
        'NEPTUNE':      './assets/neptune.glb',
        'PLUTO':        './assets/pluto.glb'
      };

      const video = document.getElementById('camFeed');
      const statusEl = document.getElementById('ocrStatus');
      const detectedEl = document.getElementById('detected-word');
      const textTracker = document.getElementById('textTracker');
      const activeModel = document.getElementById('activeModel');
      const canvas = document.getElementById('ocrCanvas');
      const ctx = canvas.getContext('2d');

      let currentActiveKey = null;
      let isProcessing = false;
      let ocrWorker = null;
      let lastSeenTime = 0;
      const HIDE_TIMEOUT_MS = 1400;

      // ---- Smoothing / anchoring state -------------------------------
      // The OCR only reports a new bounding box every ~750ms, and each
      // reading has a few pixels of noise even when the camera is
      // perfectly still. If we snap the tracker straight to every raw
      // reading it visibly "hops". Instead we keep a target (from OCR)
      // and a rendered value that eases toward the target every frame,
      // so the model settles into place and then holds still — like it
      // is actually sitting on the page.
      let targetPos = { x: 0, y: 0, z: -2 };
      let smoothPos = { x: 0, y: 0, z: -2 };
      let targetSize = 0.5;   // desired 3D size, from OCR text width
      let smoothSize = 0.5;   // size actually applied to the model
      let hasLockedOnce = false;

      // How fast the render catches up to the target each frame.
      // Lower = smoother/steadier, higher = snappier/more jittery.
      const POS_LERP = 0.12;
      const SIZE_LERP = 0.10;

      // Ignore OCR readings that barely differ from the current target —
      // this is what stops "micro-jitter" from tiny OCR noise on a
      // static piece of paper.
      const POS_DEADZONE = 0.01;   // meters
      const SIZE_DEADZONE = 0.005; // meters

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = stream;
          await video.play();
          statusEl.textContent = 'Loading OCR Engine...';
          initOCR();
        } catch (err) {
          statusEl.textContent = 'Camera permission denied.';
          console.error(err);
        }
      }

      async function initOCR() {
        try {
          ocrWorker = await Tesseract.createWorker('eng');
          statusEl.textContent = 'Ready — Point camera at text';
          startTextScanLoop();
          startRenderLoop();
        } catch (err) {
          statusEl.textContent = 'OCR initialization failed.';
          console.error(err);
        }
      }

      // Hard-centers geometry inside a Three.js Group so rotation is 100% on-axis
      activeModel.addEventListener('model-loaded', () => {
        const threeGroup = activeModel.getObject3D('mesh');
        if (!threeGroup) return;

        // Strip any embedded animation tracks to kill orbital translations
        if (threeGroup.animations) {
          threeGroup.animations.length = 0;
        }

        // Reset group coordinates
        threeGroup.position.set(0, 0, 0);
        threeGroup.rotation.set(0, 0, 0);
        threeGroup.scale.set(1, 1, 1);
        threeGroup.updateMatrixWorld(true);

        // Compute true bounding box across all child meshes
        const bbox = new THREE.Box3().setFromObject(threeGroup);
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        bbox.getCenter(center);
        bbox.getSize(size);

        // Shift inner children so the true bounding center is (0, 0, 0)
        threeGroup.traverse((child) => {
          if (child.isMesh) {
            child.geometry.computeBoundingBox();
            child.position.sub(center);
          }
        });

        // Recalculate normalized scale based on the current smoothed size
        const maxMeshDim = Math.max(size.x, size.y, size.z);
        if (maxMeshDim > 0) {
          const baseScale = smoothSize / maxMeshDim;
          activeModel.setAttribute('scale', `${baseScale} ${baseScale} ${baseScale}`);
        }

        // Snap smoothing state to the tracker's current position so a
        // freshly-loaded model doesn't glide in from some old target.
        smoothPos = { ...targetPos };
      });

      // Single render loop: spins the model AND eases its position/size
      // toward the latest OCR reading. This runs every frame (60fps-ish)
      // regardless of how often OCR actually produces a new reading.
      function startRenderLoop() {
        let angle = 0;

        function render() {
          angle = (angle + 0.015) % (Math.PI * 2);

          const threeGroup = activeModel.getObject3D('mesh');

          if (threeGroup) {
            // Pure on-axis spin, perpendicular to the text plane
            threeGroup.rotation.z = angle;
          }

          // Ease position toward the latest OCR-derived target
          smoothPos.x = lerp(smoothPos.x, targetPos.x, POS_LERP);
          smoothPos.y = lerp(smoothPos.y, targetPos.y, POS_LERP);
          smoothPos.z = targetPos.z; // depth plane is fixed, no need to ease
          textTracker.setAttribute(
            'position',
            `${smoothPos.x.toFixed(4)} ${smoothPos.y.toFixed(4)} ${smoothPos.z.toFixed(4)}`
          );

          // Ease size toward the latest OCR-derived target and re-apply scale
          smoothSize = lerp(smoothSize, targetSize, SIZE_LERP);
          if (threeGroup) {
            const box = new THREE.Box3().setFromObject(threeGroup);
            const size = new THREE.Vector3();
            box.getSize(size);
            // Use the object's *unscaled* max dimension so we don't compound
            // the previous frame's scale into this frame's calculation.
            const currentScale = activeModel.getAttribute('scale');
            const s = currentScale && currentScale.x ? currentScale.x : 1;
            const unscaledMax = Math.max(size.x, size.y, size.z) / (s || 1);
            if (unscaledMax > 0) {
              const newScale = smoothSize / unscaledMax;
              activeModel.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
            }
          }

          // Auto-hide when text disappears from frame
          if (Date.now() - lastSeenTime > HIDE_TIMEOUT_MS && textTracker.getAttribute('visible')) {
            textTracker.setAttribute('visible', 'false');
            detectedEl.textContent = 'None';
            currentActiveKey = null;
            hasLockedOnce = false;
          }

          requestAnimationFrame(render);
        }
        render();
      }

      async function startTextScanLoop() {
        setInterval(async () => {
          if (isProcessing || !ocrWorker || video.readyState !== video.HAVE_ENOUGH_DATA) return;

          isProcessing = true;

          const scanW = 480;
          const scanH = Math.round(video.videoHeight * (scanW / video.videoWidth));
          canvas.width = scanW;
          canvas.height = scanH;
          ctx.drawImage(video, 0, 0, scanW, scanH);

          try {
            const { data } = await ocrWorker.recognize(canvas);
            let matchFound = false;

            if (data && data.words) {
              for (const wordObj of data.words) {
                const cleanedText = wordObj.text.toUpperCase().replace(/[^A-Z0-9]/g, '');

                for (const key of Object.keys(MODEL_MAP)) {
                  const keyCleaned = key.replace(/\s+/g, '');
                  if (cleanedText === keyCleaned || cleanedText.includes(keyCleaned)) {
                    matchFound = true;
                    lastSeenTime = Date.now();

                    const bbox = wordObj.bbox;
                    const textCenterX = (bbox.x0 + bbox.x1) / 2;
                    const textCenterY = (bbox.y0 + bbox.y1) / 2;
                    const textPixelWidth = Math.abs(bbox.x1 - bbox.x0);

                    // Map 2D pixel coordinates to normalized device coordinates (-1 to 1)
                    const ndcX = (textCenterX / scanW) * 2 - 1;
                    const ndcY = -((textCenterY / scanH) * 2 - 1);

                    // Perspective projection at plane Z = -2.0 meters
                    const planeZ = -2.0;
                    const fovRad = (80 * Math.PI) / 180;
                    const planeHalfH = Math.tan(fovRad / 2) * Math.abs(planeZ);
                    const planeHalfW = planeHalfH * (window.innerWidth / window.innerHeight);

                    const newPosX = ndcX * planeHalfW;
                    const newPosY = ndcY * planeHalfH;

                    // Convert detected word width in pixels to exact 3D world meters
                    const text3DWidth = (textPixelWidth / scanW) * (planeHalfW * 2);
                    const newSize = Math.max(text3DWidth, 0.25);

                    // --- Dead-zone + target update (no direct setAttribute here) ---
                    // First-ever lock: snap immediately so it doesn't glide in
                    // from the origin. After that, only move the *target*;
                    // the render loop eases toward it smoothly.
                    if (!hasLockedOnce) {
                      targetPos = { x: newPosX, y: newPosY, z: planeZ };
                      smoothPos = { ...targetPos };
                      targetSize = newSize;
                      smoothSize = newSize;
                      hasLockedOnce = true;
                    } else {
                      const dx = Math.abs(newPosX - targetPos.x);
                      const dy = Math.abs(newPosY - targetPos.y);
                      if (dx > POS_DEADZONE || dy > POS_DEADZONE) {
                        targetPos = { x: newPosX, y: newPosY, z: planeZ };
                      }
                      if (Math.abs(newSize - targetSize) > SIZE_DEADZONE) {
                        targetSize = newSize;
                      }
                    }

                    if (currentActiveKey !== key) {
                      currentActiveKey = key;
                      detectedEl.textContent = key;
                      activeModel.setAttribute('gltf-model', MODEL_MAP[key]);
                      hasLockedOnce = false; // let the new model snap-lock in cleanly
                    }

                    textTracker.setAttribute('visible', 'true');
                    break;
                  }
                }
                if (matchFound) break;
              }
            }
          } catch (err) {
            console.error('OCR Error:', err);
          } finally {
            isProcessing = false;
          }
        }, 750);
      }

      window.addEventListener('DOMContentLoaded', startCamera);
    </script>
  </body>
</html>

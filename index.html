<!DOCTYPE html>
<html>
  <head>
    <title>Solar System Text AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      /* Native camera stream strictly behind WebGL */
      #camFeed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      /* A-Frame transparent canvas overlay */
      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        background: transparent !important;
      }

      #hud {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 22px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 100;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        pointer-events: none;
      }

      #detected-word {
        font-weight: bold;
        color: #4CAF50;
      }

      #model-status {
        color: #FFC107;
        font-size: 12px;
        display: block;
        margin-top: 2px;
      }

      #ocrCanvas {
        display: none;
      }
    </style>
  </head>
  <body>

    <!-- Camera Feed -->
    <video id="camFeed" autoplay playsinline webkit-playsinline muted></video>

    <!-- Status HUD -->
    <div id="hud">
      Status: <span id="ocrStatus">Opening camera...</span><br>
      Detected: <span id="detected-word">None</span>
      <span id="model-status"></span>
    </div>

    <canvas id="ocrCanvas"></canvas>

    <!-- Transparent WebGL AR Scene -->
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: false; powerPreference: high-performance; precision: lowp; colorManagement: true;">
      
      <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false" fov="80"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2.0" position="2 4 3"></a-light>

      <!-- Stationary AR anchor placed directly over detected text -->
      <a-entity id="textTracker" position="0 0 -2" visible="false">
        <a-entity id="activeModel"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const MODEL_MAP = {
        'SOLAR SYSTEM': './assets/solarsystem.glb',
        'SOLARSYSTEM':  './assets/solarsystem.glb',
        'SUN':          './assets/sun.glb',
        'MOON':         './assets/moon.glb',
        'MERCURY':      './assets/mercury.glb',
        'VENUS':        './assets/venus.glb',
        'EARTH':        './assets/earth.glb',
        'MARS':         './assets/mars.glb',
        'JUPITER':      './assets/jupiter.glb',
        'SATURN':       './assets/saturn.glb',
        'URANUS':       './assets/uranus.glb',
        'NEPTUNE':      './assets/neptune.glb',
        'PLUTO':        './assets/pluto.glb'
      };

      const video = document.getElementById('camFeed');
      const statusEl = document.getElementById('ocrStatus');
      const detectedEl = document.getElementById('detected-word');
      const modelStatusEl = document.getElementById('model-status');
      const textTracker = document.getElementById('textTracker');
      const activeModel = document.getElementById('activeModel');
      const canvas = document.getElementById('ocrCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      let currentActiveKey = null;
      let isProcessing = false;
      let ocrWorker = null;
      let lastSeenTime = 0;
      let target3DSize = 0.5;
      const HIDE_TIMEOUT_MS = 1400;

      // 1. Instant Camera Opening (Zero Loops, Direct Hardware Access)
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          
          // Camera is already rendering; now download OCR in the background
          statusEl.textContent = 'Preparing text scanner...';
          setTimeout(initOCR, 50);
        } catch (err) {
          // Absolute minimal fallback if back-camera query fails
          try {
            const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = fallbackStream;
            await video.play();
            statusEl.textContent = 'Preparing text scanner...';
            setTimeout(initOCR, 50);
          } catch (e) {
            statusEl.textContent = 'Camera blocked. Please allow permissions.';
          }
        }
      }

      // 2. Background Asynchronous OCR Initialization
      async function initOCR() {
        try {
          ocrWorker = await Tesseract.createWorker('eng', 1, {
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
            corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core-simd.wasm.js'
          });

          await ocrWorker.setParameters({
            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',
            tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT
          });

          statusEl.textContent = 'Ready — Point camera at text';
          startTextScanLoop();
          startVisibilityWatchdog();
        } catch (err) {
          statusEl.textContent = 'Scanner engine error.';
          console.error(err);
        }
      }

      // 3. Normalize, center, clear animations, and match text dimensions
      activeModel.addEventListener('model-loaded', () => {
        const threeGroup = activeModel.getObject3D('mesh');
        if (!threeGroup) return;

        // Clear embedded animation tracks to keep model completely static
        if (threeGroup.animations) {
          threeGroup.animations.length = 0;
        }

        threeGroup.position.set(0, 0, 0);
        threeGroup.rotation.set(0, 0, 0);
        threeGroup.scale.set(1, 1, 1);
        threeGroup.updateMatrixWorld(true);

        const bbox = new THREE.Box3().setFromObject(threeGroup);
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        bbox.getCenter(center);
        bbox.getSize(size);

        threeGroup.traverse((child) => {
          if (child.isMesh) {
            child.geometry.computeBoundingBox();
            child.position.sub(center);
          }
        });

        const maxMeshDim = Math.max(size.x, size.y, size.z);
        if (maxMeshDim > 0) {
          const baseScale = target3DSize / maxMeshDim;
          activeModel.setAttribute('scale', `${baseScale} ${baseScale} ${baseScale}`);
        }

        activeModel.setAttribute('visible', 'true');
        modelStatusEl.textContent = '';
      });

      activeModel.addEventListener('model-error', (err) => {
        modelStatusEl.textContent = 'Model file not found (404)';
        console.error('GLTF Load Error:', err);
      });

      // 4. Auto-hide watchdog when text leaves frame
      function startVisibilityWatchdog() {
        function check() {
          if (Date.now() - lastSeenTime > HIDE_TIMEOUT_MS && textTracker.getAttribute('visible')) {
            textTracker.setAttribute('visible', 'false');
            detectedEl.textContent = 'None';
            currentActiveKey = null;
          }
          requestAnimationFrame(check);
        }
        check();
      }

      // 5. Detection loop
      async function startTextScanLoop() {
        setInterval(async () => {
          if (isProcessing || !ocrWorker || video.readyState < 2) return;

          isProcessing = true;

          const scanW = 320;
          const scanH = Math.round(video.videoHeight * (scanW / video.videoWidth)) || 240;
          canvas.width = scanW;
          canvas.height = scanH;
          ctx.drawImage(video, 0, 0, scanW, scanH);

          try {
            const { data } = await ocrWorker.recognize(canvas);
            let matchFound = false;

            if (data && data.words) {
              for (const wordObj of data.words) {
                const cleanedText = wordObj.text.toUpperCase().replace(/[^A-Z0-9]/g, '');

                for (const key of Object.keys(MODEL_MAP)) {
                  const keyCleaned = key.replace(/\s+/g, '');
                  if (cleanedText === keyCleaned || cleanedText.includes(keyCleaned)) {
                    matchFound = true;
                    lastSeenTime = Date.now();

                    const bbox = wordObj.bbox;
                    const textCenterX = (bbox.x0 + bbox.x1) / 2;
                    const textCenterY = (bbox.y0 + bbox.y1) / 2;
                    const textPixelWidth = Math.abs(bbox.x1 - bbox.x0);

                    const ndcX = (textCenterX / scanW) * 2 - 1;
                    const ndcY = -((textCenterY / scanH) * 2 - 1);

                    const planeZ = -2.0;
                    const fovRad = (80 * Math.PI) / 180;
                    const planeHalfH = Math.tan(fovRad / 2) * Math.abs(planeZ);
                    const planeHalfW = planeHalfH * (window.innerWidth / window.innerHeight);

                    const posX = ndcX * planeHalfW;
                    const posY = ndcY * planeHalfH;

                    const text3DWidth = (textPixelWidth / scanW) * (planeHalfW * 2);
                    target3DSize = Math.max(text3DWidth, 0.25);

                    textTracker.setAttribute('position', `${posX.toFixed(3)} ${posY.toFixed(3)} ${planeZ}`);

                    const threeGroup = activeModel.getObject3D('mesh');
                    if (threeGroup) {
                      const box = new THREE.Box3().setFromObject(threeGroup);
                      const size = new THREE.Vector3();
                      box.getSize(size);
                      const maxDim = Math.max(size.x, size.y, size.z);
                      if (maxDim > 0) {
                        const s = target3DSize / maxDim;
                        activeModel.setAttribute('scale', `${s} ${s} ${s}`);
                      }
                    }

                    if (currentActiveKey !== key) {
                      currentActiveKey = key;
                      detectedEl.textContent = key;
                      modelStatusEl.textContent = `Loading ${key}...`;
                      activeModel.setAttribute('gltf-model', MODEL_MAP[key]);
                    }

                    textTracker.setAttribute('visible', 'true');
                    break;
                  }
                }
                if (matchFound) break;
              }
            }
          } catch (err) {
            console.error('Scan Error:', err);
          } finally {
            isProcessing = false;
          }
        }, 500);
      }

      window.addEventListener('DOMContentLoaded', startCamera);
    </script>
  </body>
</html>
